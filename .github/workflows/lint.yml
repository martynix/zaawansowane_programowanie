name: Python Linting CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja narzędzia Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Weryfikacja formatowania (Black)
        run: black --check .